<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>アニモ ホーム生産プランナー</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#F5F5F0;--card:#FFFFFF;--line:#E2E2DC;--line2:#C9C9C1;--ink:#1C1C1A;--muted:#5F5F58;--accent:#0E6E62;--accent2:#0A5249;--soft:#E3F1EE;--input:#FFFDF2;--warn:#8A3F06;--warnbg:#FDF1E3;--head:#F0F0EA}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Noto Sans JP',Meiryo,sans-serif;font-size:15px;line-height:1.6}
header{background:var(--card);border-bottom:1px solid var(--line)}
.wrap{max-width:1200px;margin:0 auto;padding:0 24px}
.top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;padding-top:14px}
.title{font-size:20px;font-weight:700}
.tools{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
button{font:inherit;cursor:pointer}
.btn{min-height:44px;padding:0 16px;border:1px solid var(--accent);background:var(--card);border-radius:8px;color:var(--accent);font-weight:700}
.link{min-height:44px;padding:0 8px;border:none;background:none;color:var(--muted);font-size:13px;text-decoration:underline}
nav.tabs{display:flex;gap:4px;flex-wrap:wrap;margin-top:8px}
nav.tabs button{padding:12px 16px;border:none;background:none;color:var(--muted);font-size:15px;border-bottom:3px solid transparent}
nav.tabs button[aria-current=page]{color:var(--accent);font-weight:700;border-bottom-color:var(--accent)}
main{max-width:1200px;margin:0 auto;padding:24px;display:flex;flex-direction:column;gap:20px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:20px;display:flex;flex-direction:column;gap:12px}
h2{margin:0;font-size:18px}
.h{margin:0 0 12px}
p{margin:0}
.muted{color:var(--muted)}
.small{font-size:13px}
.note{margin-top:-12px;font-size:13px}
.warn{background:var(--warnbg);color:var(--warn);padding:10px 14px;border-radius:8px}
.hl,.bar{flex-direction:row;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:16px}
.big{display:flex;align-items:center;gap:8px;font-size:18px}
.big input{width:80px;font-size:20px;font-weight:700}
input.num{min-height:38px;border:1px solid var(--line2);border-radius:6px;background:var(--input);text-align:center;font:inherit;width:56px;color:var(--ink)}
input.w{width:100px;text-align:right;padding:0 8px}
input.ww{width:130px;text-align:right;padding:0 8px}
select.num{min-height:38px;border:1px solid var(--line2);border-radius:6px;background:var(--input);font:inherit;color:var(--ink);text-align:center;text-align-last:center;width:56px;padding:0 2px}
select.num.w{width:100px}
.big select.num{width:90px;font-size:20px;font-weight:700}
input.num::placeholder{color:#8C8C84}
.scroll{overflow-x:auto}
table.grid{border-collapse:collapse;width:100%;min-width:900px;font-size:14px}
table.grid.lv{min-width:480px;font-size:15px}
.grid th,.grid td{padding:6px 8px;border-top:1px solid var(--line);text-align:center;white-space:nowrap}
.grid thead th{background:var(--head);border-top:none;font-weight:700;font-size:13px}
.grid tbody th{text-align:left;font-weight:500}
.r{text-align:right!important}
.grid td.na{color:#B5B5AD}
.b{font-weight:700}
tr.sep th,tr.sep td{border-top:2px solid var(--line2)}
.seg{display:inline-flex;border:1px solid var(--line2);border-radius:8px;overflow:hidden;background:var(--card)}
.seg button{min-height:44px;padding:0 18px;border:none;background:var(--card);color:var(--ink);font-size:15px}
.seg button[aria-pressed=true]{background:var(--accent);color:#fff;font-weight:700}
.seg.sm button{min-height:36px;padding:0 12px;font-size:13px}
.seg button:disabled{opacity:.45;cursor:not-allowed}
.eff{white-space:nowrap}
.mix{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;font-size:13px;width:250px}
.grid td:last-child{text-align:left}
.mix label{white-space:nowrap}
.mix label{display:inline-flex;gap:4px;align-items:center}
select.num.s,input.num.s{width:52px}
.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px}
.row{display:flex;justify-content:space-between;align-items:center;gap:12px}
.notes{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:4px 16px}
.chk{display:flex;align-items:center;gap:8px;min-height:40px}
.chk input{width:20px;height:20px}
.tag{font-size:12px;color:var(--muted)}
.primary{min-height:52px;padding:0 32px;border:none;background:var(--accent);color:#fff;border-radius:10px;font-size:17px;font-weight:700}
.primary:disabled{opacity:.6}
.cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;font-size:13px}
.stat .v{font-size:24px;font-weight:700;margin:2px 0}
.facs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.fac{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 16px;display:flex;flex-direction:column;gap:8px}
.fh{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.ic{width:24px;height:24px;border-radius:6px;object-fit:cover;flex:none}
.ic.round{border-radius:50%}
.ic.ph{display:inline-block;background:var(--head)}
.nm{display:inline-flex;align-items:center;gap:8px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:4px 12px 4px 4px;border-radius:999px;background:var(--soft);color:var(--accent2);font-size:14px}
.chip.t{background:var(--warnbg);color:var(--warn)}
.chip.o{background:var(--head);color:var(--muted)}
#banner{background:var(--warnbg);border-bottom:1px solid #F0D9BC}
#banner .wrap{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;padding-top:10px;padding-bottom:10px}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 18px;border-radius:10px;font-size:14px;z-index:10;max-width:90vw}
@media (max-width:760px){
  .wrap{padding:0 16px} main{padding:16px 16px 96px}
  .title{font-size:17px}
  nav.tabs{position:fixed;left:0;right:0;bottom:0;margin:0;background:var(--card);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:0;z-index:5}
  nav.tabs button{min-height:58px;padding:4px 2px;font-size:11px;border-bottom:none;border-top:3px solid transparent}
  nav.tabs button[aria-current=page]{border-top-color:var(--accent)}
  .two,.facs{grid-template-columns:minmax(0,1fr)}
  .cards{grid-template-columns:repeat(2,minmax(0,1fr))}
  .notes{grid-template-columns:minmax(0,1fr)}
  .stat .v{font-size:20px}
  .primary{width:100%}
  #toast{bottom:80px}
}
</style>
</head>

const POWER_LV = 12;
const W_PER_LV = 15;   // 1台の消費電力 ＝ 15W × 施設Lv
const POWER_W = { 1: 600, 2: 800, 3: 2000 };   // 電源モジュールLv → 最大発電量（わかったLvだけ）
function maxPowerW(state) {
  if (+state.homeLv && +state.homeLv < POWER_LV) return 0;
  const m = +state.power.module;
  if (!m) return 0;
  return POWER_W[m] != null ? POWER_W[m] : (+state.power.maxW || 0);
}   // 電源モジュール（発電ポール）が解放されるキャンパーLv

// 施設ごとのレベルの上限（metabot.gg の施設一覧より）
const FAC_MAX_LV = { 10: 7, 11: 6, 12: 6, 13: 5, 14: 2, 15: 1, 16: 3, 17: 3, 21: 4, 22: 4, 23: 4, 24: 6,
  31: 7, 32: 6, 33: 7, 34: 5, 35: 5, 36: 5, 41: 6, 42: 8 };

// ホームLvで上げられる施設の最高レベル（わからない範囲は8）
function maxFacLv(fac, H) {
  const top = FAC_MAX_LV[fac] || 8;
  if (!H) return top;
  let ub = top;
  for (const c in UNLOCK) if (+c > H && UNLOCK[c][fac]) ub = Math.min(ub, UNLOCK[c][fac] - 1);
  return Math.max(0, ub);
}

// 畑・植林地の区画を置くレベル（次の解放の1つ手前、なければ解放済みの最高レベル）
function placeLv(fac, H) {
  let later = 99, known = 0;
  for (const c in UNLOCK) {
    const l = UNLOCK[c][fac]; if (!l) continue;
    if (+c > H) later = Math.min(later, l - 1); else known = Math.max(known, l);
  }
  if (later >= 99) return known || 8;
  if (known && (later - known > 1 || UNLOCK[H] && UNLOCK[H][fac] === known)) return known;   // 間がわからない／ちょうど解放されたときは確実な方
  return Math.max(1, later);
}

function defaultState() {
  const facs = {};
  for (const c of [10, 11, 12, 13, 14, 15, 16, 17, 21, 22, 23, 24, 31, 32, 33, 34, 35, 36, 41, 42]) {
    facs[c] = { lv: [0, 0, 0, 0, 0, 0, 0, 0] };
    if (POWER_FACS(c)) facs[c].mode = '電力';
    if (EFF_FACS(c)) facs[c].eff = 100;
  }
  return {
    v: 1, homeLv: '', facs,
    power: { on: false, module: '', maxW: '', wPer: 15 },
    mods: { '生態': '', 'キッチン': '', 'クラフト作業': '', '資源探知機': '' },
    notes: {},
    lvup: { stock: {}, coin: '', manual: {} },
    calcMode: 'coin'
  };
}

// 「すべて最大」で使うレベル：このホームLvで解放が確かめられている最高レベル（今入っているレベルの方が高ければそちら）
function knownMaxLv(fac, H, cur) {
  let k = 0;
  for (const c in UNLOCK) if (+c <= H && UNLOCK[c][fac]) k = Math.max(k, UNLOCK[c][fac]);
  return Math.min(maxFacLv(fac, H), Math.max(k, cur || 0));
}

// 置けることが確かめられている台数（キャンパーLv: 台数）。プランナーサイトのLv.2〜6と、Lv.16の実際のホームより
const KNOWN_COUNT = {
  12: { 3: 2, 5: 3, 7: 4, 9: 5, 11: 6, 13: 7, 15: 8 }, 13: { 4: 1, 8: 2, 14: 3 }, 16: { 5: 1, 14: 2 }, 17: { 10: 1, 16: 2 },
  21: { 6: 1, 10: 2, 14: 3 }, 22: { 6: 1, 10: 2, 14: 3 }, 23: { 7: 1, 14: 2 }, 24: { 1: 1, 9: 2, 16: 2 },
  31: { 4: 1, 11: 2, 16: 2 }, 32: { 5: 1, 12: 2, 16: 2 }, 33: { 4: 1, 12: 2, 16: 2 }, 34: { 8: 1, 15: 2 },
  35: { 6: 1, 13: 2, 16: 2 }, 36: { 8: 1, 15: 2 }, 41: { 6: 1, 14: 2 }, 42: { 3: 1, 10: 2, 16: 2 }
};
function knownCount(fac, H) {
  let n = 0;
  const o = KNOWN_COUNT[fac] || {};
  for (const h in o) if (+h <= H) n = Math.max(n, o[h]);
  if (fac === 12) for (const c in LVUP_REQ) if (+c - 1 <= H && LVUP_REQ[c].mine) n = Math.max(n, LVUP_REQ[c].mine);
  if (fac === 13) for (const c in LVUP_REQ) if (+c - 1 <= H && LVUP_REQ[c].well) n = Math.max(n, LVUP_REQ[c].well);
  return maxFacLv(fac, H) > 0 ? n : 0;
}

// キャンパーLvごとのモジュールの最大Lv（プランナーサイトのLv.2〜15で確認。16以降は不明なので8まで）
const MOD_MAX = {
  '生態':       [0, 0, 1, 1, 1, 1, 2, 3, 3, 3, 4, 5, 5, 6, 6],
  'キッチン':   [0, 1, 1, 2, 2, 2, 2, 3, 3, 4, 4, 4, 5, 5, 5],
  'クラフト作業': [0, 0, 0, 0, 1, 1, 2, 2, 2, 3, 3, 4, 4, 4, 4],
  '資源探知機': [0, 0, 0, 0, 1, 1, 1, 2, 2, 2, 3, 4, 5, 5, 6]
};
function modMax(name, H) {
  if (!H) return 8;
  const a = MOD_MAX[name]; if (!a) return 8;
  return H <= a.length ? a[H - 1] : 8;
}
function powerModMax(H) {
  if (!H) return 5;
  if (H < POWER_LV) return 0;
  if (H <= 13) return 1;   // 発電ポール Lv.1＝600W（キャンパーLv.12〜13）
  if (H <= 15) return 2;   // Lv.2＝800W（キャンパーLv.14〜15）
  return 5;                // Lv.16以降は不明
}

// ホームLvで決まる最大設置数（わかっている施設だけ。不明は null）
function maxCount(fac, H) {
  if (!H) return null;
  if (fac === 10) return H * 2 + 2;
  if (fac === 11) return H >= 2 ? H + 1 : 0;
  if (fac === 14) return H >= 6 ? 1 : 0;   // ミツドリハウス（おそらく1つまで）
  if (fac === 15) return H >= 12 ? 1 : 0;   // 星降るハンモック（おそらく1つまで）
  return null;
}

// ホームLvを入れたときの自動入力（畑・植林地の区画数、電力の有無）
function applyHomeLv(state) {
  const H = +state.homeLv;
  if (!H) return;
  for (const [c, n] of [[10, H * 2 + 2], [11, H >= 2 ? H + 1 : 0]]) {
    const lv = [0, 0, 0, 0, 0, 0, 0, 0]; if (n > 0) lv[placeLv(c, H) - 1] = n; state.facs[c].lv = lv;
  }
  state.power.on = H >= POWER_LV;
  for (const k in state.mods) if (+state.mods[k] > modMax(k, H)) state.mods[k] = modMax(k, H);
  if (+state.power.module > powerModMax(H)) state.power.module = powerModMax(H) || '';
  for (const c in state.facs) {
    const mx = maxFacLv(+c, H);
    state.facs[c].lv = state.facs[c].lv.map((v, i) => (i < mx ? v : 0));
  }
}

function lvupTargets(state) {
  const req = state.homeLv ? LVUP_REQ[+state.homeLv + 1] : null;
  const mats = {};
  for (const c of LVUP_ITEMS) {
    const man = state.lvup.manual[c];
    mats[c] = man != null && man !== '' ? +man : (req && req.mats[c]) || 0;
  }
  const coin = state.lvup.manual.coin != null && state.lvup.manual.coin !== '' ? +state.lvup.manual.coin : (req && req.coin != null ? req.coin : 0);
  return { known: !!req, mats, coin, req };
}

// 電力で動かす台数（電力が使えないときは0。未設定なら全台）
function poweredCount(state, fac) {
  const f = state.facs[fac] || {};
  const total = (f.lv || []).reduce((s, v) => s + (+v || 0), 0);
  if (!POWER_FACS(fac) || !state.power.on || (+state.homeLv && +state.homeLv < POWER_LV)) return 0;
  const pm = f.pmode || (f.mode === 'アニモ' ? 'A' : 'P');   // P＝電力、M＝複合、A＝アニモ
  if (pm === 'P') return total;
  if (pm === 'A') return 0;
  return Math.min(total, +f.pw || 0);
}

function buildModel(D, state) {
  const items = {};
  for (const [code, name, sell, buy, nosale] of D.items) items[code] = { name, sell: nosale ? 0 : (sell || 0), buy: buy == null ? null : buy };
  const caps = {}, avgLv = {};
  for (const [code] of D.facs) {
    const a = (state.facs[code] && state.facs[code].lv) || [0, 0, 0, 0, 0, 0, 0, 0];
    const cap = []; let acc = 0, sum = 0, cnt = 0;
    for (let L = 8; L >= 1; L--) { acc += +a[L - 1] || 0; cap[L - 1] = acc; }
    for (let L = 1; L <= 8; L++) { sum += L * (+a[L - 1] || 0); cnt += +a[L - 1] || 0; }
    caps[code] = cap; avgLv[code] = cnt ? sum / cnt : 0;
  }
  // 電力／アニモの台数（電力を使える施設だけ）
  const modeCaps = {};
  for (const [code] of D.facs) {
    if (!POWER_FACS(code)) continue;
    const pw = poweredCount(state, code), total = caps[code][0];
    modeCaps[code] = { P: pw, A: total - pw };
  }
  const recs = [];
  for (const r of D.recipes) {
    const [code, fac, lv, name, out, oq, by, bq, ins, sec0, cond, clv] = r;
    if (!caps[fac] || sec0 <= 0) continue;
    if (cond === 'ノート' || cond === 'シーズン' || cond === 'コラボ') { if (!state.notes[code]) continue; }
    else if (cond) { if ((+state.mods[cond] || 0) < clv) continue; }
    const fs = state.facs[fac] || {};
    const eff = (+fs.eff || 100) / 100;
    // 電力を使える施設は「電力」と「アニモ」の2通りを作る（台数の上限は modeCaps）
    const variants = POWER_FACS(fac) ? [['P', sec0, W_PER_LV * avgLv[fac]], ['A', sec0 / eff, 0]]
      : [['', EFF_FACS(fac) ? sec0 / eff : sec0, 0]];
    for (const [mode, sec, w] of variants) {
      if (mode && !(modeCaps[fac] && modeCaps[fac][mode] > 0)) continue;
      const rate = 3600 / sec;
      const coef = {};
      const add = (k, q) => { if (k == null) return; coef[k] = (coef[k] || 0) + q * rate; };
      add(out, oq); if (by) add(by, bq || 0); for (const [k, q] of ins) add(k, -q);
      let p = 0; for (const k in coef) p += (items[k] ? items[k].sell : 0) * coef[k];
      recs.push({ code, fac, lv, name, coef, p, w, rate, ins, out, mode });
    }
  }
  const t = lvupTargets(state), tgt = {};
  for (const c in t.mats) { const d = t.mats[c] - (+state.lvup.stock[c] || 0); if (d > 0) tgt[c] = d; }
  return { items, recs, caps, modeCaps, powCap: maxPowerW(state), tgt, targets: t };
}

if (typeof module !== 'undefined') module.exports = { poweredCount, applyHomeLv, maxFacLv, defaultState, buildModel, lvupTargets, LVUP_ITEMS, LVUP_REQ, POWER_FACS, EFF_FACS };

<script>
// ===== 最適化（外部ライブラリなし）=====
// 1) 小数のまま最適化（シンプレックス法） 2) 台数を整数に丸める 3) 1台ずつ入れ替えて改善
// 素材優先モード：目標の不足分をそろえる速さ s（＝1/時間）を最大、同じならコイン最大
const PRIO_W = 1e11;

function simplexMax(c, A, b) {
  const m = A.length, n = c.length, W = n + m;
  const T = new Array(m);
  for (let i = 0; i < m; i++) {
    const row = new Float64Array(W + 1);
    for (let j = 0; j < n; j++) row[j] = A[i][j];
    row[n + i] = 1; row[W] = b[i]; T[i] = row;
  }
  const z = new Float64Array(W + 1);
  for (let j = 0; j < n; j++) z[j] = -c[j];
  const basis = new Int32Array(m);
  for (let i = 0; i < m; i++) basis[i] = n + i;
  const EPS = 1e-9;
  let degen = 0;
  for (let it = 0; it < 50000; it++) {
    const bland = degen > 50;
    let enter = -1, best = -EPS;
    for (let j = 0; j < W; j++) {
      if (z[j] < -EPS) {
        if (bland) { enter = j; break; }
        if (z[j] < best) { best = z[j]; enter = j; }
      }
    }
    if (enter < 0) break;
    let leave = -1, ratio = 0;
    for (let i = 0; i < m; i++) {
      const a = T[i][enter];
      if (a > EPS) {
        const r = T[i][W] / a;
        if (leave < 0 || r < ratio - EPS || (Math.abs(r - ratio) <= EPS && basis[i] < basis[leave])) { leave = i; ratio = r; }
      }
    }
    if (leave < 0) throw new Error('計算が発散しました');
    degen = ratio <= EPS ? degen + 1 : 0;
    const prow = T[leave], piv = prow[enter];
    for (let j = 0; j <= W; j++) prow[j] /= piv;
    for (let i = 0; i < m; i++) {
      if (i === leave) continue;
      const f = T[i][enter];
      if (f !== 0) { const Ti = T[i]; for (let j = 0; j <= W; j++) Ti[j] -= f * prow[j]; }
    }
    const f = z[enter];
    if (f !== 0) for (let j = 0; j <= W; j++) z[j] -= f * prow[j];
    basis[leave] = enter;
  }
  const x = new Float64Array(n);
  for (let i = 0; i < m; i++) if (basis[i] < n) x[basis[i]] = T[i][W];
  return { x, obj: z[W] };
}

// model: { items:{code:{sell,buy}}, recs:[{fac,lv,coef:{code:v},w,p,name,...}], caps:{fac:[cap L1..L8]}, powCap, tgt:{code:deficit} }
function makeSolver(model) {
  const R = model.recs, nR = R.length;
  const caps = model.caps, modeCaps = model.modeCaps || {};
  let prio = false, chain = new Array(nR).fill(false);

  function solveLP(y) {           // y=null: 小数（容量で縛る）
    const xs = [];
    for (let j = 0; j < nR; j++) if (!y || y[j] > 0 || (prio && chain[j])) xs.push(j);
    if (!xs.length) return null;
    const used = new Set();
    for (const j of xs) for (const k in R[j].coef) used.add(k);
    const buys = [...used].filter((k) => model.items[k] && model.items[k].buy != null);
    const nx = xs.length, nb = buys.length;
    let sCol = -1, nv = nx + nb;
    if (prio) {
      let ok = Object.keys(model.tgt).length > 0;
      for (const k in model.tgt) if (!used.has(k)) ok = false;
      if (ok) { sCol = nv; nv++; }
    }
    const c = new Array(nv).fill(0);
    xs.forEach((j, t) => { c[t] = R[j].p; });
    buys.forEach((k, t) => { const it = model.items[k]; c[nx + t] = it.sell - it.buy - 0.001; });
    if (sCol >= 0) c[sCol] = PRIO_W;
    const A = [], b = [];
    const bnd = xs.map((j) => !!y && !(prio && chain[j]));
    xs.forEach((j, t) => { if (bnd[t]) { const r = new Array(nv).fill(0); r[t] = 1; A.push(r); b.push(y[j]); } });
    for (const f in caps) {
      for (let L = 1; L <= 8; L++) {
        let any = false; const r = new Array(nv).fill(0);
        xs.forEach((j, t) => { if (!bnd[t] && String(R[j].fac) === f && R[j].lv >= L) { r[t] = 1; any = true; } });
        if (any) { A.push(r); b.push(caps[f][L - 1]); }
      }
    }
    for (const f in modeCaps) {          // 電力の台数・アニモの台数
      for (const md of ['P', 'A']) {
        let any = false; const r = new Array(nv).fill(0);
        xs.forEach((j, t) => { if (!bnd[t] && String(R[j].fac) === f && R[j].mode === md) { r[t] = 1; any = true; } });
        if (any) { A.push(r); b.push(modeCaps[f][md]); }
      }
    }
    for (const k of used) {
      const r = new Array(nv).fill(0);
      xs.forEach((j, t) => { const v = R[j].coef[k]; if (v) r[t] = -v; });
      const bi = buys.indexOf(k); if (bi >= 0) r[nx + bi] = -1;
      if (sCol >= 0 && model.tgt[k]) r[sCol] = model.tgt[k];
      A.push(r); b.push(0);
    }
    if (xs.some((j) => R[j].w > 0)) {
      const r = new Array(nv).fill(0); xs.forEach((j, t) => { r[t] = R[j].w; }); A.push(r); b.push(Math.max(0, model.powCap));
    }
    const { x, obj } = simplexMax(c, A, b);
    return { xs, buys, x, obj, s: sCol >= 0 ? x[sCol] : 0 };
  }

  function evalPlan(y) {
    const lp = solveLP(y);
    if (!lp) return { v: -1e18, lp: null };
    let sum = 0; for (let j = 0; j < nR; j++) sum += y[j];
    return { v: lp.obj - 0.01 * sum, lp };
  }

  function fits(y, j) {
    const cap = caps[R[j].fac]; if (!cap) return false;
    for (let L = 1; L <= R[j].lv; L++) {
      let s = 0;
      for (let t = 0; t < nR; t++) if (R[t].fac === R[j].fac && R[t].lv >= L) s += y[t];
      if (s + 1 > cap[L - 1] + 1e-9) return false;
    }
    const mc = modeCaps[R[j].fac];
    if (mc && R[j].mode) {
      let s = 0;
      for (let t = 0; t < nR; t++) if (R[t].fac === R[j].fac && R[t].mode === R[j].mode) s += y[t];
      if (s + 1 > mc[R[j].mode] + 1e-9) return false;
    }
    return true;
  }

  function round(xr) {
    const y = new Array(nR).fill(0), order = [];
    for (let j = 0; j < nR; j++) {
      if (xr[j] > 1e-6 && !(prio && chain[j])) {
        for (let k = 0; k < Math.floor(xr[j] + 1e-6); k++) if (fits(y, j)) y[j]++;
        const fr = xr[j] - y[j];
        if (fr > 1e-6) order.push([R[j].fac < 20 ? fr : 1 + xr[j], j]);
      }
    }
    order.sort((a, b) => b[0] - a[0]);
    for (const [, j] of order) if (fits(y, j)) y[j]++;
    return y;
  }

  function improve(y, best, passes, onProgress) {
    const facs = [...new Set(R.map((r) => r.fac))];
    const cand = {};
    for (const f of facs) {
      cand[f] = R.map((r, j) => j).filter((j) => R[j].fac === f && caps[f] && caps[f][R[j].lv - 1] > 0)
        .sort((a, b) => R[b].p - R[a].p).slice(0, 6);
    }
    let n = 0;
    for (let ps = 0; ps < passes; ps++) {
      let imp = false;
      for (const f of facs) {
        if (prio && R.some((r, j) => r.fac === f && chain[j])) continue;
        const js = R.map((r, j) => j).filter((j) => R[j].fac === f && y[j] > 0);
        const ks = [...new Set([...cand[f], ...js])];
        for (const j of js) {
          for (const k of ks) {
            if (k === j || y[j] === 0) continue;
            y[j]--;
            if (fits(y, k)) {
              y[k]++; const e = evalPlan(y); n++;
              if (e.v > best + 1e-6) { best = e.v; imp = true; continue; }
              y[k]--;
            }
            y[j]++;
          }
          if (y[j] > 0) {
            y[j]--; const e = evalPlan(y); n++;
            if (e.v > best + 1e-6) { best = e.v; imp = true; } else y[j]++;
          }
        }
        if (onProgress) onProgress(n);
      }
      if (!imp) break;
    }
    return best;
  }

  function solveFull(passes = 3) {
    const lp = solveLP(null);
    const xr = new Array(nR).fill(0);
    if (lp) lp.xs.forEach((j, t) => { xr[j] = lp.x[t]; });
    const y = round(xr);
    let best = evalPlan(y).v;
    best = improve(y, best, passes);
    const fin = evalPlan(y);
    return { y, ...fin };
  }

  // 目標から材料をさかのぼり、その工程にある加工施設を「時間で切り替える」施設にする
  function setChain() {
    const need = new Set(Object.keys(model.tgt));
    let chg = true;
    while (chg) {
      chg = false;
      for (const r of R) {
        if (r.fac < 20) continue;
        if (Object.keys(r.coef).some((k) => r.coef[k] > 0 && need.has(k))) {
          for (const k in r.coef) if (r.coef[k] < 0 && !need.has(k)) { need.add(k); chg = true; }
        }
      }
    }
    const fset = new Set();
    for (const r of R) if (r.fac >= 20 && Object.keys(r.coef).some((k) => r.coef[k] > 0 && need.has(k))) fset.add(r.fac);
    chain = R.map((r) => fset.has(r.fac));
    return need;
  }

  // コイン最大の配置のまま、目標の工程に1台ずつ割り当てた場合の達成速度 s
  function goalFixed(y0) {
    const need = setChain();
    const y = y0.slice();
    const cr = R.map((r, j) => j).filter((j) => chain[j] && Object.keys(R[j].coef).some((k) => R[j].coef[k] > 0 && need.has(k)))
      .sort((a, b) => R[b].lv - R[a].lv);
    for (const j of cr) if (y[j] === 0 && fits(y, j)) y[j] = 1;
    const keep = chain; chain = new Array(nR).fill(false); prio = true;
    const e = evalPlan(y);
    prio = false; chain = keep;
    return e.lp ? e.lp.s : 0;
  }

  return {
    R, caps, fits, evalPlan, solveFull, goalFixed,
    setPrio(on) { prio = on; if (on) return setChain(); chain = new Array(nR).fill(false); return null; },
    chainOf: () => chain,
    needItems: () => setChain()
  };
}

<script>
// ===== 画面 =====
const D = window.GAME_DATA;
const ICONS = window.GAME_ICONS || {};
const FAC_ICONS = window.FAC_ICONS || { pic: {}, map: {} };
// kind: 'pic'＝施設の見た目、'map'＝マップの簡易アイコン
const fic = (c, kind = 'pic') => {
  const src = FAC_ICONS[kind][c];
  return src ? `<img class="ic${kind === 'map' ? ' round' : ''}" src="${src}" alt="" width="24" height="24">` : `<span class="ic ph${kind === 'map' ? ' round' : ''}" aria-hidden="true"></span>`;
};
const ic = (code) => (ICONS[code] ? `<img class="ic" src="${ICONS[code]}" alt="" width="24" height="24">` : '');
const FAC_NAME = Object.fromEntries(D.facs.map(([c, n]) => [c, n]));
const ITEM = Object.fromEntries(D.items.map((r) => [r[0], { name: r[1], sell: r[2], buy: r[3] }]));
const NOTE_RECS = D.recipes.filter((r) => ['ノート', 'シーズン', 'コラボ'].includes(r[10]));
const MULTI = new Set([10, 11, 12, 13]);           // 台数を分けて使う施設
const STORE_KEY = 'aniimo-planner-v1';
const sel = (attrs, val, max, min = 0, cls = 'num') => {
  let o = '';
  const v = val === '' || val == null ? '' : +val;
  if (min > 0) o += `<option value="" ${v === '' ? 'selected' : ''}>—</option>`;
  for (let i = min; i <= max; i++) o += `<option value="${i}" ${v === i || (v === '' && i === 0 && min === 0) ? 'selected' : ''}>${i}</option>`;
  if (v !== '' && v > max) o += `<option value="${v}" selected>${v}</option>`;
  return `<select class="${cls}" ${attrs}>${o}</select>`;
};
const fmt = (n, d = 0) => (n == null || !isFinite(n) ? '—' : Number(n).toLocaleString('ja-JP', { maximumFractionDigits: d, minimumFractionDigits: d }));
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const hrs = (h) => (h == null || !isFinite(h) ? '—' : h < 1 ? '1時間未満' : '約' + fmt(h) + '時間' + (h >= 48 ? '（' + fmt(h / 24, 1) + '日）' : ''));

// ---- 共有用URL ----
async function encodeState() {
  const json = JSON.stringify(state);
  const b64 = (bytes) => btoa(String.fromCharCode(...bytes)).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
  if (window.CompressionStream) {
    const cs = new Blob([json]).stream().pipeThrough(new CompressionStream('deflate-raw'));
    const buf = new Uint8Array(await new Response(cs).arrayBuffer());
    return 'z' + b64(buf);
  }
  return 'j' + b64(new TextEncoder().encode(json));
}
async function decodeState(s) {
  const bin = atob(s.slice(1).replace(/-/g, '+').replace(/_/g, '/'));
  const bytes = Uint8Array.from(bin, (c) => c.charCodeAt(0));
  let json;
  if (s[0] === 'z') {
    const ds = new Blob([bytes]).stream().pipeThrough(new DecompressionStream('deflate-raw'));
    json = await new Response(ds).text();
  } else json = new TextDecoder().decode(bytes);
  const o = JSON.parse(json);
  if (!o || o.v !== 1) throw new Error('形式が違います');
  return o;
}
async function copyShareUrl() {
  const url = location.href.split('#')[0] + '#d=' + (await encodeState());
  try { await navigator.clipboard.writeText(url); toast('共有用URLをコピーしました（' + url.length + '文字）'); }
  catch (e) { prompt('このURLをコピーしてください', url); }
}
function toast(msg) {
  const t = document.getElementById('toast'); t.textContent = msg; t.hidden = false;
  clearTimeout(toast.t); toast.t = setTimeout(() => { t.hidden = true; }, 2600);
}
function backupFile() {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([JSON.stringify(state, null, 1)], { type: 'application/json' }));
  a.download = 'aniimo-planner.json'; a.click();
}

// ---- 計算 ----
function runCalc() {
  const model = buildModel(D, state);
  const S = makeSolver(model);
  const prio = state.calcMode === 'prio';
  const hasTgt = Object.keys(model.tgt).length > 0;
  const t0 = performance.now();
  let coinRun, out;
  S.setPrio(false);
  coinRun = S.solveFull();
  if (prio && hasTgt) { S.setPrio(true); out = S.solveFull(); } else out = coinRun;
  const lp = out.lp, R = S.R;
  const x = new Array(R.length).fill(0);
  if (lp) lp.xs.forEach((j, t) => { x[j] = lp.x[t]; });
  const coinH = lp ? lp.obj - (prio && hasTgt ? 1e11 * lp.s : 0) : 0;
  let s = 0;
  if (hasTgt) s = prio ? lp.s : (S.setPrio(false), S.goalFixed(coinRun.y));
  const chain = prio && hasTgt ? S.chainOf() : R.map(() => false);
  // 施設ごとの表示
  const byFac = {};
  R.forEach((r, j) => {
    const n = chain[j] ? x[j] : out.y[j];
    if (n <= 1e-3) return;
    const mix = model.modeCaps[r.fac] && model.modeCaps[r.fac].P > 0 && model.modeCaps[r.fac].A > 0;
    const tag = mix && r.mode ? (r.mode === 'P' ? '（電力）' : '（アニモ）') : '';
    const lab = chain[j] ? r.name + tag + ' ' + fmt(n, 2) + '台分' : r.name + tag + (MULTI.has(r.fac) || n > 1 ? ' ' + n : '');
    (byFac[r.fac] = byFac[r.fac] || []).push({ lab, t: chain[j], code: r.out });
  });
  // 1日に使う種
  const seeds = {};
  R.forEach((r, j) => { if (x[j] > 1e-6) for (const [k, q] of r.ins) if (k < 100) seeds[k] = (seeds[k] || 0) + q * r.rate * x[j] * 24; });
  // 消費電力
  let pow = 0; R.forEach((r, j) => { pow += r.w * x[j]; });
  // 切り替えの目安
  const guide = [];
  if (prio && hasTgt && s > 0) {
    const T = 1 / s, need = S.needItems();
    const fs = [...new Set(R.filter((r, j) => chain[j]).map((r) => r.fac))];
    for (const f of fs) {
      const steps = R.map((r, j) => j).filter((j) => R[j].fac === f && x[j] > 1e-3 && Object.keys(R[j].coef).some((k) => R[j].coef[k] > 0 && need.has(k)))
        .sort((a, b) => R[a].lv - R[b].lv)
        .map((j) => { const n = Math.min(S.caps[f][R[j].lv - 1], S.caps[f][0]); return { name: R[j].name, n, h: x[j] * T / n }; });
      if (steps.length) guide.push({ fac: FAC_NAME[f], steps });
    }
  }
  const coinNeed = Math.max(0, model.targets.coin - (+state.lvup.coin || 0));
  result = {
    mode: prio && hasTgt ? 'prio' : 'coin', modeAsked: state.calcMode, hasTgt, coinH, pow, byFac, seeds, guide,
    T: s > 0 ? 1 / s : (hasTgt ? Infinity : null), coinNeed, coinT: coinNeed > 0 ? coinNeed / Math.max(1, coinH) : 0,
    ms: Math.round(performance.now() - t0), at: new Date()
  };
}

// ---- 入力 ----
function onInput(e) {
  const el = e.target, d = el.dataset, v = el.value.trim();
  const num = v === '' ? '' : Math.max(0, Number(v.replace(/[^\d.]/g, '')) || 0);
  if (d.fac) {
    const f = state.facs[d.fac], i = +d.lv;
    let n = num === '' ? 0 : Math.round(num);
    const mc = maxCount(+d.fac, +state.homeLv);
    if (mc != null) {
      const others = f.lv.reduce((s, v, k) => s + (k === i ? 0 : +v || 0), 0);
      if (others + n > mc) { n = Math.max(0, mc - others); toast(`最大設置数は${mc}です`); }
    }
    f.lv[i] = n;
  }
  else if (d.eff) state.facs[d.eff].eff = num === '' ? null : num;
  else if (d.pwn) state.facs[d.pwn].pw = num === '' ? 0 : Math.round(num);
  else if (d.mod) state.mods[d.mod] = num === '' ? 0 : num;
  else if (d.pw) state.power[d.pw] = num === '' ? 0 : num;
  else if (d.home !== undefined) { state.homeLv = num === '' ? '' : Math.round(num); applyHomeLv(state); }
  else if (d.goal) { if (num === '') delete state.lvup.manual[d.goal]; else state.lvup.manual[d.goal] = num; }
  else if (d.stock) state.lvup.stock[d.stock] = num === '' ? '' : num;
  else if (d.coin !== undefined) state.lvup.coin = num;
  else if (d.note) state.notes[d.note] = el.checked;
  else return;
  result = null; save();
}
function onChange(e) {
  onInput(e);
  const keep = document.activeElement && document.activeElement.dataset ? Object.assign({}, document.activeElement.dataset) : null;
  render();
  if (keep) { const q = Object.entries(keep).map(([k, v]) => `[data-${k.replace(/[A-Z]/g, (m) => '-' + m.toLowerCase())}="${v}"]`).join(''); const el = q && document.querySelector(q); if (el) el.focus(); }
}
async function onClick(e) {
  const b = e.target.closest('button,[data-tab]'); if (!b) return;
  const d = b.dataset;
  if (d.tab) { tab = d.tab; render(); window.scrollTo(0, 0); return; }
  if (d.pmode) {
    const f = state.facs[d.pmode]; f.pmode = d.v;
    if (d.v === 'M' && (f.pw == null || f.pw === '')) f.pw = Math.ceil(f.lv.reduce((s, x) => s + (+x || 0), 0) / 2);
    result = null;
  }
  else if (d.power) { const H = +state.homeLv; state.power.on = d.power === '1' && !(H && H < POWER_LV); result = null; }
  else if (d.maxall !== undefined) {
    const H = +state.homeLv;
    if (!H) { toast('先にホームレベルを入力してください'); return; }
    for (const [c] of D.facs) {
      const f = state.facs[c];
      const cur = f.lv.reduce((s, v, i) => (+v > 0 ? i + 1 : s), 0);
      const mx = knownMaxLv(c, H, cur);
      const mc = maxCount(c, H);
      const total = mc != null ? mc : Math.max(f.lv.reduce((s, v) => s + (+v || 0), 0), knownCount(c, H));
      const lv = [0, 0, 0, 0, 0, 0, 0, 0];
      if (mx > 0 && total > 0) lv[mx - 1] = total;
      f.lv = lv;
    }
    result = null; toast('施設を最大にしました。台数は、確かめられている数か今の数の多い方です');
  }
  else if (d.calcmode) { state.calcMode = d.calcmode; result = null; }
  else if (d.run !== undefined) {
    b.disabled = true; b.textContent = '計算中…';
    await new Promise((r) => setTimeout(r, 30));
    try { runCalc(); } catch (err) { alertBox('計算できませんでした：' + err.message); }
  } else if (d.share !== undefined) { await copyShareUrl(); return; }
  else if (d.backup !== undefined) { backupFile(); return; }
  else if (d.restore !== undefined) { document.getElementById('file').click(); return; }
  else if (d.accept !== undefined) { state = pendingShare; pendingShare = null; history.replaceState(null, '', location.pathname); save(); result = null; toast('共有されたデータを読み込みました'); }
  else if (d.reject !== undefined) { pendingShare = null; history.replaceState(null, '', location.pathname); }
  else return;
  save(); render();
}
function alertBox(msg) { toast(msg); }

document.addEventListener('change', onChange);
document.addEventListener('click', onClick);
document.getElementById('file').addEventListener('change', async (e) => {
  const f = e.target.files[0]; if (!f) return;
  try { const o = JSON.parse(await f.text()); if (o.v !== 1) throw new Error(); state = o; save(); result = null; render(); toast('ファイルから読み込みました'); }
  catch (err) { toast('読み込めないファイルです'); }
  e.target.value = '';
});

(async () => {
  const m = location.hash.match(/#d=(.+)$/);
  if (m) { try { pendingShare = await decodeState(m[1]); } catch (e) { toast('共有URLを読み込めませんでした'); } }
  render();
})();

</script>
